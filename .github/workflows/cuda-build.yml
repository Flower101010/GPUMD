name: GPUMD CUDA/CMake build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpumd-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build gpumd and nep
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.3'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Show toolchain versions
        run: |
          cmake --version
          ninja --version
          nvcc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75

      - name: Build gpumd and nep
        run: cmake --build build --parallel 2 --target gpumd nep

      - name: Upload gpumd/nep artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpumd-nep
          path: |
            build/gpumd
            build/nep
          if-no-files-found: error
          retention-days: 14
